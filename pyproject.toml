[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diagagent-rag"
version = "0.1.0"
description = "Retrieval-augmented diagnostics for industrial equipment"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "httpx>=0.27,<1",
    "numpy>=1.26.4,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "PyYAML>=6.0.1,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]
huggingface = [
    "sentence-transformers>=3.4,<6",
]

[tool.setuptools.packages.find]
include = ["src", "src.*"]
namespaces = false

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".venv310"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
